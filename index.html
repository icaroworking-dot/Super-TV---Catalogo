<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A instalar Addon no Tuvora...</title>
  <script>
    // Redireciona automaticamente ao abrir a página
    window.location.href = "stremio://catalog.nuvio.tv/%7B%22language%22%3A%22pt-BR%22%2C%22region%22%3A%22BR%22%7D/manifest.json";
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background-color: #0e0e12;
      color: #ffffff;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background-color: #1a1a24;
      padding: 30px;
      border-radius: 14px;
      border: 1px solid #2b2b3d;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h2 {
      margin-top: 0;
      font-size: 22px;
    }
    p {
      color: #a0a0b2;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background-color: #6c5ce7;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #5b4cc4;
    }
    .btn-secondary {
      display: inline-block;
      margin-top: 12px;
      font-size: 14px;
      color: #8f8fa3;
      text-decoration: underline;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>A instalar Addon...</h2>
    <p>O Tuvora deverá abrir automaticamente em breves instantes com a tela de confirmação.</p>
    
    <!-- Botão principal usando o protocolo stremio:// -->
    <a class="btn" href="stremio://catalog.nuvio.tv/%7B%22language%22%3A%22pt-BR%22%2C%22region%22%3A%22BR%22%7D/manifest.json">
      Instalar no Tuvora

    <br>
    
    <!-- Opção alternativa caso o app utilize o protocolo tuvor:// -->
    <a class="btn-secondary" href="tuvora://catalog.nuvio.tv/%7B%22language%22%3A%22pt-BR%22%2C%22region%22%3A%22BR%22%7D/manifest.json">
      Não abriu? Tente esta ligação alternativa
    </a>
  </div>
</body>
</html>
